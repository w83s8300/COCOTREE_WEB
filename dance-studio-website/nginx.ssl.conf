# 1. HTTP 服務：強制導向至 HTTPS，並保留 Let's Encrypt 驗證通道
server {
    listen 80;
    server_name coconuttreedancestudio.ddns.net;

    # Let's Encrypt SSL 憑證驗證路徑
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有請求全部 301 轉址到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 加密服務
server {
    listen 443 ssl http2;
    server_name coconuttreedancestudio.ddns.net;

    # SSL 憑證路徑 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/coconuttreedancestudio.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coconuttreedancestudio.ddns.net/privkey.pem;

    # SSL 安全強化設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全性防護標頭 (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 允許檔案上傳限制（16M）
    client_max_body_size 16M;

    # 開啟 Gzip 壓縮，加快頁面載入速度
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 前端單頁應用 (SPA) 路由
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 後端 API 反向代理到 Docker 的 backend 服務
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
