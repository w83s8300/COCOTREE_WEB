<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Palm Fronds & Motion Gradients -->
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow for dark screen -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Outer Ring with Dynamic Rhythm Dashes -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="16 10 4 10"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#palmGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Central Emblem Elements -->
  <g id="brand-graphic" transform="translate(0, -10)">
    <!-- Tree Trunk with Energetic Dance S-Curve -->
    <path d="M250,330 C242,280 234,235 256,180 C261,168 259,165 256,165 C251,165 242,185 238,230 C234,275 240,320 242,330 Z" 
          fill="url(#trunkGrad)"/>
    
    <!-- Rhythm trunk ring accents -->
    <path d="M241,290 C247,288 253,288 256,290" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M239,260 C245,258 251,258 254,260" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M242,225 C247,223 253,223 255,225" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Dynamic Palm Fronds (Shaped as energetic dance ribbons / wings) -->
    <!-- Center top fountain fronds -->
    <path d="M256,165 C256,130 250,95 256,70 C262,95 264,130 256,165 Z" 
          fill="url(#palmGrad)" filter="url(#glowEffect)"/>
    
    <!-- Top left sweeping frond -->
    <path d="M256,165 C230,135 185,110 135,115 C175,130 220,155 256,165 Z" 
          fill="url(#palmGrad)"/>
    
    <!-- Top right sweeping frond -->
    <path d="M256,165 C282,135 327,110 377,115 C337,130 292,155 256,165 Z" 
          fill="url(#palmGrad)"/>

    <!-- Mid left dynamic dance curve frond -->
    <path d="M256,165 C220,155 160,155 110,185 C155,180 210,180 256,165 Z" 
          fill="url(#palmGrad)" opacity="0.95"/>

    <!-- Mid right dynamic dance curve frond -->
    <path d="M256,165 C292,155 352,155 402,185 C357,180 302,180 256,165 Z" 
          fill="url(#palmGrad)" opacity="0.95"/>

    <!-- Lower left swooping frond -->
    <path d="M256,168 C225,185 180,215 140,260 C165,225 215,200 256,168 Z" 
          fill="url(#palmGrad)" opacity="0.85"/>

    <!-- Lower right swooping frond -->
    <path d="M256,168 C287,185 332,215 372,260 C347,225 297,200 256,168 Z" 
          fill="url(#palmGrad)" opacity="0.85"/>

    <!-- Coconuts / Golden energy orbs -->
    <circle cx="248" cy="172" r="9" fill="url(#goldGrad)" filter="url(#glowEffect)"/>
    <circle cx="264" cy="172" r="8" fill="url(#goldGrad)" filter="url(#glowEffect)"/>
    <circle cx="256" cy="183" r="8.5" fill="url(#goldGrad)" filter="url(#glowEffect)"/>

    <!-- Ground groove dynamic soundwave / dance floor -->
    <path d="M190,332 C230,326 270,326 310,332" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M165,342 C220,336 280,336 335,342" stroke="url(#palmGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Studio Typography -->
  <!-- Brand English Name -->
  <text x="256" y="380" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="5">
    COCONUT TREE
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="256" y="408" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="9">
    DANCE STUDIO
  </text>

  <!-- Chinese Brand Name -->
  <text x="256" y="438" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" 
        font-size="13" 
        font-weight="500" 
        letter-spacing="6">
    椰子樹舞蹈工作室
  </text>
</svg>
