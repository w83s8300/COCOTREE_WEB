version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=w83s8300
      - DB_PASSWORD=!Q83a8300
      - DB_NAME=cocotree_db
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ["python", "app.py"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  dance-studio-website:
    build:
      context: ./dance-studio-website
      dockerfile: Dockerfile.dev
    container_name: dance-studio-website
    restart: unless-stopped
    ports:
      - "3001:5173"
    volumes:
      - ./dance-studio-website:/app
    working_dir: /app
    command: sh -c "npm run dev -- --host"
    environment:
      - API_PROXY_TARGET=http://backend:8001
    networks:
      - app-network

  # MySQL (Database)
  db:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "!Q83a8300"
      MYSQL_DATABASE: cocotree_db
      MYSQL_USER: w83s8300
      MYSQL_PASSWORD: "!Q83a8300"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./mysql/update_teachers_table.sql:/docker-entrypoint-initdb.d/02-update_teachers_table.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "w83s8300", "-p!Q83a8300"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
